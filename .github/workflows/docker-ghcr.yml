name: Publish a Docker image to ghcr.io
on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'jupyterlab-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - run: echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Enable buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker build/push (tag)
        if: github.event_name == 'release'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:${{ env.TAG }}
      - name: Docker build/push (latest)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:latest
