name: e2e-dashboard-tests
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/e2e-dashboard-tests.yml'
      - '**.py'
      - 'tslib/**.ts'
      - 'tslib/**.tsx'
      - 'tslib/**/package.json'
      - 'optuna_dashboard/**.ts'
      - 'optuna_dashboard/**.tsx'
      - 'optuna_dashboard/package.json'
      - 'optuna_dashboard/tsconfig.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        optuna-version: ['optuna==3.6.0', 'git+https://github.com/optuna/optuna.git']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Setup tslib
        run: make tslib

      - name: Build bundle.js
        run: pnpm --filter @optuna/optuna-dashboard run build:dev

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --group test

      - name: Setup Optuna ${{ matrix.optuna-version }}
        run: uv pip install '${{ matrix.optuna-version }}'

      - name: Install the required browsers
        run: uv run playwright install

      - name: Run e2e tests
        run: uv run pytest e2e_tests/test_dashboard
