name: e2e-dashboard-tests
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/e2e-dashboard-tests.yml'
      - '**.py'
      - 'tslib/**.ts'
      - 'tslib/**.tsx'
      - 'tslib/**/package.json'
      - 'optuna_dashboard/**.ts'
      - 'optuna_dashboard/**.tsx'
      - 'optuna_dashboard/package.json'
      - 'optuna_dashboard/tsconfig.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        optuna-version: ['optuna==3.6.0', 'git+https://github.com/optuna/optuna.git']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Setup tslib
        run: make tslib

      - name: Build bundle.js
        run: pnpm --filter @optuna/optuna-dashboard run build:dev

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --group test

      - name: Setup Optuna ${{ matrix.optuna-version }}
        run: uv pip install '${{ matrix.optuna-version }}'

      - name: Install the required browsers
        run: uv run playwright install

      - name: Run e2e tests
        run: uv run pytest e2e_tests/test_dashboard
