name: tests
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/python-tests.yml'
      - '**.py'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          uv sync --group lint
      - run: uv run ruff check .
      - run: uv run mypy optuna_dashboard python_tests
  build-python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          uv venv
          uv pip install wheel twine build
      - run: make python-package
      - run: uv run twine check dist/*
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        optuna-version: ['optuna>=3.6.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Optuna ${{ matrix.optuna-version }}
        run: uv add '${{ matrix.optuna-version }}'
      - name: Install dependencies
        run: uv sync --group test
      - name: Run python unit tests
        run: uv run pytest python_tests
  test-with-optuna-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          uv sync --group test
          uv pip install git+https://github.com/optuna/optuna.git
      - name: Run python unit tests
        run: uv run pytest python_tests
  test-with-optuna-oldest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          uv sync --group test
          uv add optuna==3.6.0
      - name: Run python unit tests
        run: uv run pytest python_tests
